name: Desktop

# Packaged desktop builds for Windows, Linux and macOS.
#
# build.yml produces raw build output for quick checks. This workflow packages
# each platform into a single downloadable file instead, so an artifact can be
# handed to someone who has no Flutter toolchain.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Build mode
        type: choice
        options: [release, debug]
        default: release
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux
            os: ubuntu-latest
          - target: windows
            os: windows-latest
          - target: macos
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # subosito/flutter-action is a composite action whose action.yaml
      # unconditionally *declares* two `uses: actions/cache@v5` steps (guarded
      # only by a runtime `if:`), and the repo's action-pinning policy scans
      # that declared dependency graph regardless of whether the step would
      # actually run. Installing the SDK directly avoids depending on any
      # third-party action for this step at all. Split by shell so PATH ends
      # up in the syntax each OS's default shell expects.
      - name: Install Flutter SDK (Linux/macOS)
        if: matrix.target != 'windows'
        shell: bash
        run: |
          git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"

      - name: Install Flutter SDK (Windows)
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$env:USERPROFILE\flutter"
          Add-Content -Path $env:GITHUB_PATH -Value "$env:USERPROFILE\flutter\bin"

      - name: Install Linux dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      # The repository holds no generated runner directories, so each build
      # regenerates them and reapplies the project settings flutter create
      # cannot know about (window size, app name, Android permissions).
      - name: Generate platform runner
        run: flutter create --project-name vibestack_atlas --platforms=${{ matrix.target }} .

      - name: Configure platform runner
        run: dart run tool/post_create.dart

      - run: flutter pub get
      - run: flutter analyze

      - name: Verify catalog contract
        run: flutter test test/catalog_integrity_test.dart

      - run: flutter test

      - name: Read version
        id: version
        shell: bash
        run: echo "value=$(grep '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d'+' -f1)" >> "$GITHUB_OUTPUT"

      - name: Build
        shell: bash
        run: flutter build ${{ matrix.target }} --${{ inputs.mode || 'release' }}

      # ---- packaging -------------------------------------------------------
      # Each platform gets one file: a directory of loose DLLs or an .app
      # bundle downloaded as a zip of a zip is awkward to use.

      - name: Package Linux
        if: matrix.target == 'linux'
        run: |
          mode="${{ inputs.mode || 'release' }}"
          tar -czf "VibeStack-Atlas-${{ steps.version.outputs.value }}-linux-x64.tar.gz" \
            -C "build/linux/x64/$mode/bundle" .

      - name: Package Windows
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $mode = "${{ inputs.mode || 'release' }}"
          $dir = "build/windows/x64/runner/" + $mode.Substring(0,1).ToUpper() + $mode.Substring(1)
          Compress-Archive -Path "$dir/*" -DestinationPath "VibeStack-Atlas-${{ steps.version.outputs.value }}-windows-x64.zip"

      # A DMG is what macOS users expect; create-dmg is preinstalled on the
      # GitHub runners via Homebrew.
      - name: Package macOS
        if: matrix.target == 'macos'
        run: |
          mode="${{ inputs.mode || 'release' }}"
          app=$(find "build/macos/Build/Products/${mode^}" -maxdepth 1 -name '*.app' | head -1)
          test -n "$app" || { echo "no .app bundle found"; exit 1; }
          brew install create-dmg
          create-dmg \
            --volname "VibeStack Atlas" \
            --window-size 540 380 \
            --icon-size 96 \
            --app-drop-link 380 180 \
            "VibeStack-Atlas-${{ steps.version.outputs.value }}-macos.dmg" \
            "$app" \
          || hdiutil create -volname "VibeStack Atlas" -srcfolder "$app" -ov -format UDZO \
            "VibeStack-Atlas-${{ steps.version.outputs.value }}-macos.dmg"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vibestack-atlas-${{ matrix.target }}
          path: |
            *.tar.gz
            *.zip
            *.dmg
          if-no-files-found: error
