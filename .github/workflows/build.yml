name: Build Android Windows Linux macOS

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: android
            os: ubuntu-latest
            command: flutter build apk --release
            artifact: build/app/outputs/flutter-apk/app-release.apk
          - target: linux
            os: ubuntu-latest
            command: flutter build linux --release
            artifact: build/linux/x64/release/bundle
          - target: windows
            os: windows-latest
            command: flutter build windows --release
            artifact: build/windows/x64/runner/Release
          - target: macos
            os: macos-latest
            command: flutter build macos --release
            artifact: build/macos/Build/Products/Release
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Linux dependencies
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - name: Generate platform runner
        run: flutter create --project-name vibestack_atlas --platforms=${{ matrix.target }} .
      - name: Configure platform runner
        run: dart run tool/post_create.dart
      - run: flutter pub get
      - run: flutter analyze
      - name: Verify catalog contract
        run: flutter test test/catalog_integrity_test.dart
      - run: flutter test
      - run: ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        with:
          name: vibestack-atlas-${{ matrix.target }}
          path: ${{ matrix.artifact }}
