name: APK

# Fast path for "I just want an installable APK".
# Run it from the Actions tab (Run workflow), then download the artifact.
# The full matrix with Windows and Linux lives in build.yml.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Build mode"
        type: choice
        default: release
        options: [release, debug]
  push:
    tags: ["v*"]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      # subosito/flutter-action is a composite action whose action.yaml
      # unconditionally *declares* two `uses: actions/cache@v5` steps (guarded
      # only by a runtime `if:`), and the repo's action-pinning policy scans
      # that declared dependency graph regardless of whether the step would
      # actually run. Installing the SDK directly avoids depending on any
      # third-party action for this step at all.
      - name: Install Flutter SDK
        run: |
          git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"

      # android/ is intentionally not tracked: the runner is generated from the
      # current Flutter version instead of being frozen in the repository.
      - name: Generate Android runner
        run: flutter create --project-name vibestack_atlas --platforms=android .

      - name: Configure Android runner
        run: dart run tool/post_create.dart

      - run: flutter pub get

      - run: flutter analyze

      - name: Verify catalog contract
        run: flutter test test/catalog_integrity_test.dart

      - run: flutter test

      - name: Build APK
        run: flutter build apk --${{ inputs.mode || 'release' }}

      # Without a keystore Flutter signs the release build with the debug key.
      # That installs on a normal phone, which is what this artifact is for;
      # a Play Store upload needs a real keystore instead.
      - name: Rename artifact
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | cut -d' ' -f2)
          MODE=${{ inputs.mode || 'release' }}
          SRC=build/app/outputs/flutter-apk/app-$MODE.apk
          cp "$SRC" "VibeStack-Atlas-${VERSION}-${MODE}.apk"
          ls -lh VibeStack-Atlas-*.apk

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vibestack-atlas-apk
          path: VibeStack-Atlas-*.apk
          if-no-files-found: error
