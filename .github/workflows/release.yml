name: Release

# Publishes one GitHub Release carrying everything an install needs:
#
#   VibeStack-Atlas-<version>-android.apk      phone build
#   VibeStack-Atlas-<version>-windows-x64.zip  desktop builds
#   VibeStack-Atlas-<version>-linux-x64.tar.gz
#   VibeStack-Atlas-<version>-macos.dmg
#   catalog.db.gz                              the catalog itself
#   manifest.json                              what installed apps read first
#
# The last two are what makes the catalog updatable without reinstalling: an
# app checks `releases/latest/download/manifest.json`, compares the version
# with its own, and pulls the database only when there is a newer one.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish (must already exist)
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  catalog:
    name: Catalog assets
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.build.outputs.catalog }}
      app_version: ${{ steps.build.outputs.app }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # Signing is optional and fails loudly rather than silently: if the app
      # has a public key compiled in but the secret is missing, every install
      # would reject the release, so it is better not to publish one.
      - name: Check the signing key
        env:
          CATALOG_SIGNING_KEY: ${{ secrets.CATALOG_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -f data/release-key.pub ] && [ -z "${CATALOG_SIGNING_KEY:-}" ]; then
            echo "::error::data/release-key.pub is committed but CATALOG_SIGNING_KEY is not set — apps built from this commit would refuse this release"
            exit 1
          fi
          if [ -n "${CATALOG_SIGNING_KEY:-}" ]; then
            pip install --quiet cryptography
            python tool/release_key.py check "$CATALOG_SIGNING_KEY"
          else
            echo "::notice::No signing key configured; the release will be unsigned."
          fi

      - name: Build the catalog and its manifest
        id: build
        env:
          CATALOG_SIGNING_KEY: ${{ secrets.CATALOG_SIGNING_KEY }}
        run: |
          set -euo pipefail
          url="https://github.com/${{ github.repository }}/releases/download/${TAG}/catalog.db.gz"
          # Spelled out rather than `[ -n … ] && sign=…`: under `set -e` an
          # and-list whose test fails is a trap that depends on the shell.
          sign=""
          if [ -n "${CATALOG_SIGNING_KEY:-}" ]; then sign="--sign"; fi
          python tool/build_catalog.py --release --download-url "$url" $sign
          python tool/verify_catalog.py | tee -a "$GITHUB_STEP_SUMMARY"
          echo "catalog=$(python -c "import json;print(json.load(open('dist/manifest.json'))['catalogVersion'])")" >> "$GITHUB_OUTPUT"
          echo "app=$(grep '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d'+' -f1)" >> "$GITHUB_OUTPUT"
          echo "Publishing tag \`$TAG\`" >> "$GITHUB_STEP_SUMMARY"

      # A tag whose generated Dart was never rebuilt would publish an app whose
      # category labels disagree with the catalog shipped beside it.
      - name: Tagged artifacts must match the sources
        run: |
          if ! git diff --exit-code -- lib/i18n/categories.dart lib/app_info.dart; then
            echo "::error::Generated files on this tag are stale. Retag after running: python3 tool/build_catalog.py --release"
            exit 1
          fi

      - name: Diagnostics
        if: failure()
        run: |
          echo "::group::python --version"
          python --version
          echo "::endgroup::"
          echo "::group::dist/"
          ls -la dist/ 2>/dev/null || echo "(dist/ does not exist)"
          echo "::endgroup::"
          echo "::group::git status"
          git status
          echo "::endgroup::"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: catalog
          path: dist/*
          if-no-files-found: error

  build:
    name: ${{ matrix.target }}
    needs: catalog
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: android
            os: ubuntu-latest
          - target: linux
            os: ubuntu-latest
          - target: windows
            os: windows-latest
          - target: macos
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        if: matrix.target == 'android'
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # assets/catalog.db is a build artifact, not a checked-in file. The same
      # sources produce it here as produced the release assets in the catalog
      # job, so what ships inside the app and what ships next to it agree.
      - name: Build the catalog
        run: python tool/build_catalog.py

      # subosito/flutter-action is a composite action whose action.yaml
      # unconditionally *declares* two `uses: actions/cache@v5` steps (guarded
      # only by a runtime `if:`), and the repo's action-pinning policy scans
      # that declared dependency graph regardless of whether the step would
      # actually run — cache:true or cache:false makes no difference, the
      # reference in someone else's action.yaml is what gets flagged.
      # Installing the SDK directly avoids depending on any third-party
      # action for this step at all.
      - name: Install Flutter SDK (Linux/macOS)
        if: matrix.target != 'windows'
        shell: bash
        run: |
          git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"

      - name: Install Flutter SDK (Windows)
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$env:USERPROFILE\flutter"
          Add-Content -Path $env:GITHUB_PATH -Value "$env:USERPROFILE\flutter\bin"

      # stable moves under us between runs, so a failure that is really "a new
      # Flutter release changed something" is visible per-platform without
      # re-deriving it from four separate build logs. Git bash is present on
      # the Windows runner image too, so one step covers all four targets.
      - name: Flutter version
        shell: bash
        run: flutter --version | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Install Linux dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libsqlite3-dev

      - name: Generate platform runner
        run: flutter create --project-name vibestack_atlas --platforms=${{ matrix.target }} .

      - name: Configure platform runner
        run: dart run tool/post_create.dart

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Build
        shell: bash
        run: flutter build ${{ matrix.target == 'android' && 'apk' || matrix.target }} --release

      # Each platform leaves one file behind. A directory of loose DLLs or an
      # .app bundle downloaded as a zip of a zip is awkward to hand to anyone.
      - name: Package Android
        if: matrix.target == 'android'
        shell: bash
        run: cp build/app/outputs/flutter-apk/app-release.apk
          "VibeStack-Atlas-${{ needs.catalog.outputs.app_version }}-android.apk"

      - name: Package Linux
        if: matrix.target == 'linux'
        run: tar -czf "VibeStack-Atlas-${{ needs.catalog.outputs.app_version }}-linux-x64.tar.gz"
          -C build/linux/x64/release/bundle .

      - name: Package Windows
        if: matrix.target == 'windows'
        shell: pwsh
        run: Compress-Archive -Path "build/windows/x64/runner/Release/*"
          -DestinationPath "VibeStack-Atlas-${{ needs.catalog.outputs.app_version }}-windows-x64.zip"

      - name: Package macOS
        if: matrix.target == 'macos'
        run: |
          set -euo pipefail
          app=$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' | head -1)
          test -n "$app" || { echo "no .app bundle found"; exit 1; }
          out="VibeStack-Atlas-${{ needs.catalog.outputs.app_version }}-macos.dmg"
          brew install create-dmg
          create-dmg --volname "VibeStack Atlas" --window-size 540 380 \
            --icon-size 96 --app-drop-link 380 180 "$out" "$app" \
          || hdiutil create -volname "VibeStack Atlas" -srcfolder "$app" -ov -format UDZO "$out"

      - name: Diagnostics
        if: failure()
        shell: bash
        run: |
          echo "::group::flutter doctor -v"
          flutter doctor -v || true
          echo "::endgroup::"
          echo "::group::build/ tree"
          find build -maxdepth 4 2>/dev/null || echo "(no build/ directory)"
          echo "::endgroup::"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app-${{ matrix.target }}
          path: |
            VibeStack-Atlas-*.apk
            VibeStack-Atlas-*.tar.gz
            VibeStack-Atlas-*.zip
            VibeStack-Atlas-*.dmg
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [catalog, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.TAG }}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts

      - name: Collect assets
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ls -lh release

      # Release notes name the catalog explicitly: an install decides whether
      # to download 800 KB based on this version, so it belongs where a person
      # can read it too.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes=$(cat <<EOF
          App ${{ needs.catalog.outputs.app_version }} · catalog ${{ needs.catalog.outputs.version }}

          Installed apps pick the catalog up on their next daily check; there is
          nothing to reinstall. Platform builds are attached below.

          \`catalog.db.gz\` and \`manifest.json\` are the catalog itself — the app
          reads the manifest, checks the SHA-256, and swaps the database in.
          EOF
          )
          gh release create "$TAG" release/* \
            --title "VibeStack Atlas ${{ needs.catalog.outputs.app_version }}" \
            --notes "$notes" \
            --verify-tag \
          || gh release upload "$TAG" release/* --clobber
          echo "Published \`$TAG\` with $(ls release | wc -l) assets" >> "$GITHUB_STEP_SUMMARY"

      - name: Diagnostics
        if: failure()
        run: |
          echo "::group::downloaded artifacts"
          find artifacts -type f 2>/dev/null || echo "(artifacts/ does not exist)"
          echo "::endgroup::"
          echo "::group::release/ contents"
          ls -la release 2>/dev/null || echo "(release/ does not exist)"
          echo "::endgroup::"
