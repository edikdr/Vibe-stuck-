name: APK

# The fast path for "I just want an installable APK", without cutting a
# release. Actions tab -> APK -> Run workflow, then download the artifact.
# Publishing to the releases page is release.yml's job.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Build mode
        type: choice
        default: release
        options: [release, debug]

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # assets/catalog.db is a build artifact, not a checked-in file.
      - name: Build the catalog
        run: python tool/build_catalog.py

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android runner
        run: flutter create --project-name vibestack_atlas --platforms=android .

      - name: Configure Android runner
        run: dart run tool/post_create.dart

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Build APK
        run: flutter build apk --${{ inputs.mode }}

      # Without a keystore Flutter signs the release build with the debug key.
      # That installs on a normal phone, which is what this artifact is for;
      # a Play Store upload needs a real keystore instead.
      - name: Name the artifact
        run: |
          set -euo pipefail
          version=$(grep '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d'+' -f1)
          cp "build/app/outputs/flutter-apk/app-${{ inputs.mode }}.apk" \
             "VibeStack-Atlas-${version}-${{ inputs.mode }}.apk"
          ls -lh VibeStack-Atlas-*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: vibestack-atlas-apk
          path: VibeStack-Atlas-*.apk
          if-no-files-found: error
