name: CI

# Runs on every pull request and every push to the default branch.
#
# Two independent gates. The catalog gate needs only Python, so a data-only
# change gets an answer in seconds; the app gate needs the Flutter SDK.

on:
  pull_request:
  push:
    branches: [vibe-atlas]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  catalog:
    name: Catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Build the catalog
        run: python tool/build_catalog.py

      # tee'd into the step summary so the entry counts are visible on the run
      # page without opening logs; `set -o pipefail` keeps a verify failure
      # fatal even through the pipe (GitHub's default bash already sets it,
      # but this makes it explicit rather than relying on that default).
      - name: Verify the contract
        run: |
          set -o pipefail
          python tool/verify_catalog.py | tee -a "$GITHUB_STEP_SUMMARY"

      # An issue form is only validated by GitHub once it is on the default
      # branch, and a broken one is reported there long after the pull request
      # that introduced it merged.
      - name: Check the issue forms
        run: |
          python -m pip install --quiet pyyaml
          python tool/check_templates.py

      # The database is a build artifact and is not committed, but the
      # generated Dart is — it has to compile. An entry edited without a
      # rebuild would otherwise ship category labels that disagree with the
      # entries using them.
      - name: Generated Dart must match the sources
        run: |
          if ! git diff --exit-code -- lib/i18n/categories.dart lib/app_info.dart; then
            echo "::error::Generated files are stale. Run: python3 tool/build_catalog.py"
            git diff --stat -- lib/i18n/categories.dart lib/app_info.dart
            exit 1
          fi

      # Nothing here needs Flutter, so a failure is always the Python side.
      # This dumps the exact command and the tree state at the point of
      # failure, since "run python tool/build_catalog.py" alone in the log
      # doesn't say which of the two scripts, or which entry, tripped it.
      - name: Diagnostics
        if: failure()
        run: |
          echo "::group::python --version"
          python --version
          echo "::endgroup::"
          echo "::group::git status"
          git status
          echo "::endgroup::"
          echo "::group::data/catalog/"
          ls -la data/catalog/
          echo "::endgroup::"

  app:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # assets/catalog.db is a build artifact, so it is built rather than
      # checked out. Nothing below can run without it: it is the catalog.
      - name: Build the catalog
        run: python tool/build_catalog.py

      # subosito/flutter-action is a composite action whose action.yaml
      # unconditionally *declares* two `uses: actions/cache@v5` steps (guarded
      # only by a runtime `if:`), and the repo's action-pinning policy scans
      # that declared dependency graph regardless of whether the step would
      # actually run — cache:true or cache:false makes no difference, the
      # reference in someone else's action.yaml is what gets flagged.
      # Installing the SDK directly avoids depending on any third-party
      # action for this step at all.
      - name: Install Flutter SDK
        run: |
          git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"

      # stable moves under us between runs, so a failure that is really "a new
      # Flutter release changed something" instead of a code regression should
      # be obvious from the log without re-deriving it by hand.
      - name: Flutter version
        run: flutter --version | tee -a "$GITHUB_STEP_SUMMARY"

      # `flutter test` runs on the host VM, where the native SQLite comes from
      # the system rather than from sqlite3_flutter_libs. Without it the
      # database tests skip themselves instead of failing, which would quietly
      # remove the catalog contract from CI.
      - name: Install native SQLite
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-0 libsqlite3-dev

      # No platform runner is committed; it is generated from the Flutter
      # version on the runner instead of frozen in the repository.
      - name: Generate platform runner
        run: flutter create --project-name vibestack_atlas --platforms=linux .

      - name: Configure platform runner
        run: dart run tool/post_create.dart

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --reporter expanded

      # flutter analyze/test already print their own errors; this adds the
      # surrounding environment state so a failure doesn't need a re-run with
      # extra flags just to see what SDK/toolchain it happened under.
      - name: Diagnostics
        if: failure()
        run: |
          echo "::group::flutter doctor -v"
          flutter doctor -v || true
          echo "::endgroup::"
          echo "::group::pubspec.lock"
          cat pubspec.lock || true
          echo "::endgroup::"
          echo "::group::disk space"
          df -h .
          echo "::endgroup::"
